version: v1
domain: social
description: 사회환경 관련 규칙 (5개) — 주민 반복 민원 이력, 유사사업 보완 패턴, 환경정의 취약지역, 산업단지 인접, 위락시설 밀집
rules:
- rule_id: SOC-001
  rule_version: v1
  title: 주민 반복 민원 이력 — 환경 갈등 지역
  trigger_dataset: 유사사례 라이브러리(큐레이션) / EIASS 협의 이력
  condition:
    field: social.repeated_complaints
    operator: gte
    value: 3
  severity: major
  rationale: '사업 부지 인근에서 과거 유사 사업에 대해 3건 이상의 반복적인 주민 민원· 환경 갈등 이력이 확인됩니다. 소음, 악취,
    교통, 경관 등이 주요 쟁점이며, 주민 수용성이 사업 추진의 핵심 리스크가 될 수 있습니다.

    '
  evidence: 유사사례 라이브러리 — 인근 지역 민원·갈등 이력 / EIASS 협의 이력
  next_action: 주민 설명회 조기 계획 수립. 주요 민원 쟁점 파악 및 사전 대응 전략 마련
  legal_basis: 환경영향평가법 제25조 (주민 의견 수렴)
  confidence: 0.7
  human_review_required: true
- rule_id: SOC-002
  rule_version: v1
  title: 유사사업 반복 보완 패턴 — 동일 유형 사업 보완 요구 빈출
  trigger_dataset: 유사사례 라이브러리(큐레이션) / EIASS 협의 이력
  condition:
    field: social.similar_project_supplement_count
    operator: gte
    value: 2
  severity: review
  rationale: '동일 사업 유형·동일 권역에서 환경영향평가 협의 시 반복적으로 보완이 요구된 패턴이 2건 이상 확인됩니다. 해당 항목(예:
    대기질 예측 방법론, 생태조사 기간 부족 등)을 사전에 보강하면 협의 기간을 단축할 수 있습니다.

    '
  evidence: 유사사례 라이브러리 — 동일 유형 사업 보완 이력 분석
  next_action: 보완 빈출 항목 목록 확인 후 평가서 초안 작성 시 사전 보강
  legal_basis: 환경영향평가법 제29조 (협의 내용의 통보)
  confidence: 0.65
  human_review_required: false
- rule_id: SOC-003
  rule_version: v1
  title: 환경정의 취약지역 — 환경 부담 집중 우려
  trigger_dataset: 환경부 환경정의 현황 자료 / 통계청 인구·사회 데이터
  condition:
    field: social.environmental_justice_vulnerable
    operator: eq
    value: true
  severity: review
  rationale: '사업 부지가 환경정의 관점에서 취약한 지역에 해당합니다. 소득수준이 낮거나 기존 환경 오염시설이 집중된 지역에 추가적인 환경
    부담을 지우는 사업은 환경 형평성 문제를 야기할 수 있습니다. 해당 지역 주민의 건강·복지에 대한 누적 영향을 고려하고, 주민 의견 수렴 절차를
    강화해야 합니다.

    '
  evidence: 환경부 환경정의 현황 자료 / 통계청 인구·사회 데이터 / 지자체 환경 현황
  next_action: 환경 부담 누적 현황 조사. 주민 의견 수렴 절차 강화 및 환경 개선 부대 사업 검토
  legal_basis: 환경정책기본법 제7조의2 (환경정의)
  confidence: 0.6
  human_review_required: true
- rule_id: IND-001
  rule_version: v1
  title: 산업단지 500m 이내
  trigger_dataset: 통계청 사업체조사 / 산업단지 현황
  condition:
    field: industry.industrial_complex_distance_m
    operator: within_buffer
    value: 500
    unit: m
  severity: review
  rationale: '사업 부지 500m 이내에 산업단지가 위치합니다. 산업단지에서 발생하는 대기오염·소음·진동·악취 등이 사업 부지에 영향을
    미칠 수 있으며, 반대로 주거·관광 사업의 경우 산업단지 운영에 대한 민원 발생 가능성이 있습니다.

    '
  evidence: 통계청 사업체조사 / 산업단지 관리공단 데이터
  next_action: 산업단지 배출원 현황 파악. 누적 환경 영향 검토
  legal_basis: 산업입지 및 개발에 관한 법률 제5조
  confidence: 0.7
  human_review_required: false
- rule_id: REC-001
  rule_version: v1
  title: 위락시설 밀집지역 (관광·체육 사업)
  trigger_dataset: V-world WFS POI / 위락시설 현황
  condition:
    field: facilities.recreation_density_area
    operator: eq
    value: true
  severity: review
  rationale: '사업 부지 주변이 위락시설 밀집지역입니다. 관광단지·체육시설 개발 시 기존 위락시설과의 시너지 또는 경쟁 관계를 분석해야
    하며, 야간 소음·교통량 증가·경관 변화 등의 누적 영향을 검토해야 합니다.

    '
  evidence: V-world POI 데이터 / 위락시설 밀집도 분석
  next_action: 기존 위락시설 현황 파악. 야간 소음·교통 누적 영향 분석
  legal_basis: 관광진흥법 제54조, 환경영향평가법 시행령 별표1
  confidence: 0.65
  human_review_required: false
metadata:
  legal_basis_version: '2025-02-18'
  last_verified: '2026-03-31'

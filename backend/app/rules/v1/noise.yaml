version: v1
domain: noise
description: 소음·진동 관련 규칙 (4개) — 주거지 인접 거리, 학교·병원 버퍼, 소음대책지역, 진동 민감시설
rules:
- rule_id: NOI-001
  rule_version: v1
  title: 주거지역 인접 (300m 이내) — 소음·진동 영향 검토
  trigger_dataset: 토지이용규제정보서비스 / 건축물대장 용도
  condition:
    field: noise.residential_distance_m
    operator: within_buffer
    value: 300
    unit: m
  severity: major
  rationale: '사업 부지 300m 이내에 주거지역(아파트단지, 주택밀집지역 등)이 위치합니다. 시공 중 건설장비 소음·진동, 운영 중 교통
    소음 등이 주거환경에 직접적인 영향을 미칠 수 있으며, 주민 민원의 주요 원인이 됩니다.

    '
  evidence: 토지이용규제정보 용도지역 / 건축물대장 용도별 현황
  next_action: 소음·진동 예측 평가 실시. 방음벽·방음림 등 저감 대책 사전 설계. 주민 설명회 계획
  legal_basis: 소음·진동관리법 제21조, 환경영향평가법 시행령 별표2 (소음·진동 항목)
  confidence: 0.8
  human_review_required: false
- rule_id: NOI-002
  rule_version: v1
  title: 학교·병원·요양시설 인접 (200m 이내) — 정온시설 보호
  trigger_dataset: 건축물대장 / 교육시설·의료시설 위치 데이터
  condition:
    field: noise.quiet_facility_distance_m
    operator: within_buffer
    value: 200
    unit: m
  severity: major
  rationale: '사업 부지 200m 이내에 학교, 병원, 요양시설 등 정온을 필요로 하는 시설이 위치합니다. 정온시설 주변에서는 공사 소음
    및 운영 소음에 대한 기준이 더욱 엄격하며, 환경영향평가 시 특별 검토 항목으로 지정됩니다.

    '
  evidence: 건축물대장 용도별 현황 / 교육시설 위치 데이터
  next_action: 정온시설 위치 및 이격거리 정밀 확인. 시공 시간대 제한, 저소음 공법 적용 검토
  legal_basis: 소음·진동관리법 제21조의2, 학교보건법 제6조 (학교환경위생정화구역)
  confidence: 0.8
  human_review_required: false
- rule_id: NOI-003
  rule_version: v1
  title: 소음대책지역 포함
  trigger_dataset: 환경부 소음대책지역 지정 현황 / 공항소음대책위원회
  condition:
    field: noise.noise_countermeasure_zone
    operator: eq
    value: true
  severity: major
  rationale: '사업 부지가 소음대책지역(공항소음대책지역, 도로소음대책지역 등)에 포함되어 있습니다. 소음대책지역에서는 이미 소음 환경기준을
    초과하고 있어 추가적인 소음 발생 사업에 대한 규제가 강화됩니다. 주거용 건축물 신축이 제한되거나 방음시설 설치가 의무화될 수 있으며, 주민
    보상 문제가 발생할 수 있습니다.

    '
  evidence: 환경부 소음대책지역 지정 현황 / 공항소음 방지 및 소음대책지역 지원에 관한 법률
  next_action: 소음대책지역 등급(1~3종) 확인. 사업 유형별 행위 제한 사항 검토. 방음시설 설치 계획 수립
  legal_basis: 소음·진동관리법 제39조 (소음대책지역의 지정)
  confidence: 0.85
  human_review_required: true
- rule_id: NOI-004
  rule_version: v1
  title: 진동 민감시설 인접 (100m 이내)
  trigger_dataset: 건축물대장 / 정밀기기 시설 위치 데이터
  condition:
    field: noise.vibration_sensitive_distance_m
    operator: within_buffer
    value: 100
    unit: m
  severity: review
  rationale: '사업 부지 100m 이내에 진동에 민감한 시설(정밀계측 연구소, 반도체 공장, 방송국, 녹음실 등)이 위치합니다. 시공 중
    항타·발파·굴착 등에 의한 진동이 인접 정밀 시설의 기능 장애를 유발할 수 있으며, 손해배상 책임 문제로 이어질 수 있습니다. 진동 영향 예측
    및 저진동 공법 적용이 필요합니다.

    '
  evidence: 건축물대장 용도별 현황 / 정밀기기 시설 위치 데이터
  next_action: 인접 진동 민감시설 목록 확인. 진동 영향 예측 실시 및 저진동 공법(유압 브레이커, 무진동 항타 등) 적용 검토
  legal_basis: 소음·진동관리법 제44조 (생활진동의 규제)
  confidence: 0.7
  human_review_required: false
metadata:
  legal_basis_version: '2025-02-18'
  last_verified: '2026-03-31'

version: v1
domain: soil
description: 토양·지하수 관련 규칙 (4개) — 토양오염 우려지역, 지하수 수위, 매립지 인접, 지질재해 위험
rules:
- rule_id: SOI-001
  rule_version: v1
  title: 토양오염 우려지역 — 특정토양오염관리대상시설 인접
  trigger_dataset: 토양환경정보시스템 / 토양오염실태조사 결과
  condition:
    field: soil.contamination_risk
    operator: eq
    value: true
  severity: major
  rationale: '사업 부지 또는 인접 지역에 특정토양오염관리대상시설(주유소, 공장 등)이 존재하거나, 과거 토양오염실태조사에서 오염이 확인된
    이력이 있습니다. 토지 형질변경 시 오염 확산 가능성을 검토해야 합니다.

    '
  evidence: 토양환경정보시스템 — 특정토양오염관리대상시설 목록 / 토양오염실태조사 결과
  next_action: 토양정밀조사 실시 여부 확인. 오염 확인 시 정화 계획 수립 후 사업 진행
  legal_basis: 토양환경보전법 제10조의2, 제15조 (토양오염실태조사·정밀조사)
  confidence: 0.75
  human_review_required: true
- rule_id: SOI-002
  rule_version: v1
  title: 지하수 고수위 지역 — 굴착 시 지하수 영향 우려
  trigger_dataset: 지하수정보시스템(GIMS) / 지하수관측망
  condition:
    field: soil.groundwater_level_m
    operator: lt
    value: 3
    unit: m
  severity: review
  rationale: '사업 부지의 지하수위가 지표 하 3m 이내로 높은 수준입니다. 대규모 굴착 공사 시 지하수 유출, 주변 지하수위 저하, 오염물질
    지하수 유입 등의 문제가 발생할 수 있습니다.

    '
  evidence: 지하수정보시스템(GIMS) 관측정 수위 데이터
  next_action: 지하수 영향 예측 검토 포함. 차수공법 또는 배수 대책 사전 설계
  legal_basis: 지하수법 제9조의2 (지하수 영향조사)
  confidence: 0.65
  human_review_required: false
- rule_id: SOI-003
  rule_version: v1
  title: 매립지·폐기물처리장 인접 (500m 이내)
  trigger_dataset: 환경부 폐기물처리시설 현황 / 토양환경정보시스템
  condition:
    field: soil.landfill_distance_m
    operator: within_buffer
    value: 500
    unit: m
  severity: major
  rationale: '사업 부지 500m 이내에 매립지 또는 폐기물처리장이 위치합니다. 매립지 인근에서는 침출수에 의한 토양·지하수 오염, 매립가스(메탄)
    발생, 지반 불안정 등의 문제가 발생할 수 있습니다. 폐쇄된 매립지의 경우에도 후속 관리 기간(30년) 동안 오염 확산 가능성이 있어 정밀조사가
    필요합니다.

    '
  evidence: 환경부 폐기물처리시설 현황 / 토양환경정보시스템 오염 이력
  next_action: 매립지 현황(운영 중/폐쇄) 및 오염 범위 확인. 토양·지하수 정밀조사 실시. 지반안정성 검토
  legal_basis: 폐기물관리법 제50조 (폐기물처리시설의 사후관리)
  confidence: 0.8
  human_review_required: true
- rule_id: SOI-004
  rule_version: v1
  title: 지질재해 위험지역
  trigger_dataset: 행정안전부 자연재해위험지구 현황 / 한국지질자원연구원 지질재해 정보
  condition:
    field: soil.geological_hazard_risk
    operator: eq
    value: true
  severity: review
  rationale: '사업 부지가 지질재해(산사태, 지반침하, 토석류 등) 위험지역으로 분류되어 있습니다. 지질재해 위험지역에서는 대규모 절·성토,
    사면 굴착 등의 공사 시 재해 발생 위험이 높으며, 사업 시행 후에도 장기적인 지반 안정성 모니터링이 필요합니다. 지질조사 및 재해위험성분석이
    선행되어야 합니다.

    '
  evidence: 행정안전부 자연재해위험지구 현황 / 한국지질자원연구원 지질재해 정보
  next_action: 지질조사 및 재해위험성분석 실시. 사면안정 대책(옹벽, 배수시설 등) 설계 반영
  legal_basis: 자연재해대책법 제16조의2 (재해위험성분석)
  confidence: 0.7
  human_review_required: false
metadata:
  legal_basis_version: '2025-02-18'
  last_verified: '2026-03-31'
